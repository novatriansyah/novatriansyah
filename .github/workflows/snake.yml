# Place this file at: .github/workflows/snake.yml
# in your novatriansyah/novatriansyah profile repo.
#
# What it does: every day it regenerates an SVG animation of your
# contribution graph "eaten" by a snake, and pushes it to an `output`
# branch. The README embeds that SVG directly from the raw URL.
#
# One-time setup after adding this file:
#   1. Repo Settings > Actions > General > Workflow permissions
#      -> select "Read and write permissions" and save.
#   2. Push this file, then run the workflow once manually
#      (Actions tab -> "generate snake" -> Run workflow) so the
#      `output` branch gets created immediately instead of waiting
#      for the daily schedule.

name: generate snake

on:
  schedule:
    - cron: "0 2 * * *"   # runs daily at 02:00 UTC
  workflow_dispatch: {}    # allows manual runs from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: novatriansyah
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
